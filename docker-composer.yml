version: "3"
services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
    ports:
      - "6002:6002"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

app:
  build:
  environment:
    - DB_HOST=localhost
    - DB_PORT=5433
    - DB_USER=
    - DB_PASSWORD=
    - DB_NAME=
  post:
    - "6002:6002"
  depends_on:
    - localhost

volumes:
  - pg-data:/var/lib/postgresql/data
pg-data:
