version: "3"
services:
  db:
    image: postgres
    environment:
      - POSTGRES_DB=
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

app:
  build:
  environment:
    - DB_HOST=localhost
    - DB_PORT=5433
    - DB_USER=
    - DB_PASSWORD=
    - DB_NAME=
  post:
    - "6002:6002"
  depends_on:
    - localhost

volumes:
  pg-data:
